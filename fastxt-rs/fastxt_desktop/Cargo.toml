[package]
name = "fastxt_desktop"
version = "0.1.0"
edition = "2021"
authors = ["Ares <ttenx@pm.me>"]

[[bin]]
name = "fastxt"
path = "src/bin/main.rs"

[features]
default = []
ai = ["fastxt_core/ai"]

[dependencies]
anyhow = "1"
fastxt_core = { path = "../fastxt_core" }
serde_json = "1"

[dependencies.druid]
features = ["svg"]
git = "https://github.com/linebender/druid.git"

[dependencies.qrcode]
default-features = false
features = ["svg"]
version = "0.14"
