[package]
name = "fastxt_desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fastxt desktop app — local-first text notes with on-device AI"
homepage.workspace = true
repository.workspace = true
# Shipped as installers (.dmg, .msi, .deb), not through crates.io.
publish = false

# `fastxt` is the command; the window is `fastxt-desktop`.
[[bin]]
name = "fastxt-desktop"
path = "src/bin/main.rs"

[features]
default = []
ai = ["fastxt_core/ai"]

[dependencies]
fastxt_core = { path = "../fastxt_core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
iced = { version = "0.14", features = ["qr_code", "tokio"] }

# Packaging metadata for cargo-deb (`cargo deb`). Paths are relative to this
# manifest; `target/...` resolves to the workspace target dir.
[package.metadata.deb]
name = "fastxt-desktop"
maintainer = "Yi Wang <yi@yilab.com>"
depends = "$auto"
assets = [
    ["target/release/fastxt-desktop", "usr/bin/", "755"],
    ["packaging/fastxt.desktop", "usr/share/applications/", "644"],
    ["icons/fastxt-512.png", "usr/share/icons/hicolor/512x512/apps/fastxt.png", "644"],
]
