[package]
name = "fastxt_core"
description = "The core of Fastxt: local-first notes in SQLite with full-text and vector search, on-device AI, and peer-to-peer sync"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["notes", "local-first", "sync", "sqlite", "p2p"]
categories = ["database", "text-processing"]

[features]
default = []
ai = ["reqwest"]

[dependencies.rusqlite]
version = "0.40"
features = ["bundled"]

[dependencies]
sqlite-vec = "0.1"
zerocopy = "0.8"
chrono = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tarpc = { version = "0.38", features = ["full"] }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
if-addrs = "0.15"
tracing = "0.1"

# Sync transport security: TLS with a per-device self-signed certificate that
# peers pin by fingerprint (exchanged in the pairing code).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"

# AI feature dependencies (optional)
reqwest = { version = "0.13", features = ["blocking", "json"], optional = true }

[dev-dependencies]
tempfile = "3"

[lib]
name = "fastxt_core"
