[package]
name = "fastxt_core"
version = "0.1.0"
authors = ["Yi Wang"]
license = "AGPL-3.0"
edition = "2018"

[dependencies.rusqlite]
version = "0.21.0"
features = ["bundled"]

[dependencies]
chrono = "0.4.11"
semver = "0.9.0"
serde = "1.0.104"
serde_derive = "1.0.44"
serde_json = "1.0.44"
tarpc = { version = "0.20.0", features = ["full"]}
dirs = "2.0.2"
regex = "1.3.1"
linked_hash_set = "0.1.4"
uuid = { version = "0.7.4", features = ["v4"] }
tokio = { version = "0.2", features = ["full"] }
tokio-serde = { version = "0.6", features = ["bincode"] }
futures = "0.3"
get_if_addrs = "0.5.3"

[lib]
name = "fastxt_core"

# mac and ios
crate-type = ["staticlib"]

# android only need this
# crate-type = ["cdylib"]
