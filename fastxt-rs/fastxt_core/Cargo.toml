[package]
name = "fastxt_core"
version = "0.2.0"
authors = ["Yi Wang"]
license = "AGPL-3.0"
edition = "2021"

[features]
default = []
ai = ["reqwest"]

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[dependencies]
sqlite-vec = "0.1"
zerocopy = "0.8"
chrono = "0.4"
semver = "1"
serde = "1"
serde_derive = "1"
serde_json = "1"
tarpc = { version = "0.35", features = ["full"]}
dirs = "6"
regex = "1"
linked_hash_set = "0.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
if-addrs = "0.13"
tokio-serde = { version = "0.9", features = ["bincode"] }
tracing = "0.1"

# AI feature dependencies (optional)
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

[lib]
name = "fastxt_core"

# mac and ios
# crate-type = ["staticlib"]

# android only need this
# crate-type = ["cdylib"]

# rust library
# crate-type = ["rlib"]
