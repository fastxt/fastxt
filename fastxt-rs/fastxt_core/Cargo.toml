[package]
name = "fastxt_core"
version = "0.2.0"
authors = ["Yi Wang"]
license = "AGPL-3.0"
edition = "2018"

[features]
default = []
ai = ["reqwest"]

[dependencies.rusqlite]
version = "0.25"
features = ["bundled"]

[dependencies]
chrono = "0.4.11"
semver = "0.11.0"
serde = "1"
serde_derive = "1"
serde_json = "1"
tarpc = { version = "0.26", features = ["full"]}
dirs = "3"
regex = "1.3.1"
linked_hash_set = "0.1.4"
uuid = { version = "0.8", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
get_if_addrs = "0.5.3"
tokio-serde = { version = "0.8", features = ["bincode"] }

# AI feature dependencies (optional)
reqwest = { version = "0.11", features = ["blocking", "json"], optional = true }

[lib]
name = "fastxt_core"

# mac and ios
# crate-type = ["staticlib"]

# android only need this
# crate-type = ["cdylib"]

# rust library
# crate-type = ["rlib"]
