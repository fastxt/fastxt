# The PyPI package: the Rust `fastxt` command, built by maturin into one wheel per platform, the
# way ruff and uv ship. No Python code; the version comes from fastxt-rs/Cargo.toml. Build one
# with: uvx maturin build --release
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fastxt"
dynamic = ["version"]
description = "Local-first notes that sync between your phone and your computers with no server in between, and go into the coding-agent session you pick."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yi Wang" }]
keywords = ["notes", "local-first", "sync", "mcp", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fastxt.app"
Repository = "https://github.com/fastxt/fastxt"
Issues = "https://github.com/fastxt/fastxt/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "fastxt-rs/fastxt/Cargo.toml"
